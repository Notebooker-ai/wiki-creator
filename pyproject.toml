[project]
name = "wiki-creator"
version = "0.1.0"
license = "MIT"
description = "Open Notebook creator: interlinked topic articles with citations, exported as Obsidian-ready markdown (wiki.v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "open-notebook-creator-sdk>=0.11",
    "esperanto>=2.19",
    "ai-prompter>=0.3.1",
    "langchain-core>=0.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.entry-points."open_notebook.creators"]
wikis = "wiki_creator:WikiCreator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_creator"]

[tool.uv.sources]
open-notebook-creator-sdk = { git = "https://github.com/Notebooker-ai/open-notebook-creator-sdk.git", rev = "1a5cf1ecc3d9571ed2f317fe35eddd2e799539db" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
